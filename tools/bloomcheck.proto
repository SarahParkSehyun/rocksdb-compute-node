syntax = "proto3";
package bloomcheck;

message KeyRequest {
  bytes user_key = 1;
  repeated uint64 sst_file_numbers = 2; // candidates
}

message BatchRequest {
  repeated KeyRequest reqs = 1;
}

message KeyResponse {
  repeated uint64 may_match_sst_file_numbers = 1;
}

message BatchResponse {
  repeated KeyResponse resps = 1;
}

service BloomCheck {
  rpc Check(BatchRequest) returns (BatchResponse);
}

